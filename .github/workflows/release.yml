name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build app bundle
        run: |
          pyinstaller build.spec --noconfirm

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "Axon C1 Configurator" \
            -srcfolder "dist/Axon C1 Configurator.app" \
            -ov -format UDZO \
            "Axon-C1-Configurator-${{ github.ref_name }}-macos.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: "Axon-C1-Configurator-${{ github.ref_name }}-macos.dmg"

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller build.spec --noconfirm

      - name: Zip Windows build
        run: |
          Compress-Archive -Path "dist\Axon C1 Configurator" `
            -DestinationPath "Axon-C1-Configurator-${{ github.ref_name }}-windows.zip"

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: "Axon-C1-Configurator-${{ github.ref_name }}-windows.zip"

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Axon-C1-Configurator-${{ github.ref_name }}-macos.dmg
            Axon-C1-Configurator-${{ github.ref_name }}-windows.zip
          generate_release_notes: true
